{% extends 'base.html' %}
{% block content %}
<main class="container">
    <section class="form-card">
        <h1>Add money</h1>
        <p class="subtitle">Deposit funds into your account.</p>
        <form method="post">
            <label for="amount">Amount</label>
            <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
            <button class="button dark" type="submit">Make deposit</button>
        </form>
    </section>
</main>
{% endblock %}
